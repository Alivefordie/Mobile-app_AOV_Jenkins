services:
  localstack:
    image: localstack/localstack:4.9.2
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
      - SERVICES=s3,ec2
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  localstack-data: