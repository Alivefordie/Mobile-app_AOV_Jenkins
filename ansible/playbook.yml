---
- name: Configure Taskflow API host
  hosts: taskflow
  become: true

  vars:
    taskflow_image: "{{ lookup('env', 'TASKFLOW_IMAGE') }}"

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Node.js and npm
      ansible.builtin.apt:
        name:
          - nodejs
          - npm
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker.io
        state: present

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Verify Node.js installation
      ansible.builtin.command:
        cmd: node --version
      register: node_version
      changed_when: false

    - name: Show Node.js version
      ansible.builtin.debug:
        msg: "Node.js version: {{ node_version.stdout }}"

    - name: Verify Docker installation
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Show Docker version
      ansible.builtin.debug:
        msg: "Docker version: {{ docker_version.stdout }}"

    - name: Pull Taskflow API image from Lab 07 registry
      ansible.builtin.command:
        cmd: "docker pull {{ taskflow_image }}"
      register: pull_result
      changed_when: >
        'Downloaded newer image' in pull_result.stdout
        or 'Pull complete' in pull_result.stdout
