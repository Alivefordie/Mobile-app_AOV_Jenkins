---
- name: Configure Taskflow API host
  hosts: taskflow
  become: true

  vars:
    taskflow_image: "{{ lookup('env', 'TASKFLOW_IMAGE') }}"

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Node.js and npm
      ansible.builtin.apt:
        name:
          - nodejs
          - npm
        state: present

    - name: Install Docker CLI
      ansible.builtin.apt:
        name:
          - docker.io
        state: present

    - name: Verify Docker socket exists
      ansible.builtin.stat:
        path: /var/run/docker.sock
      register: docker_socket

    - name: Fail if Docker socket is unavailable
      ansible.builtin.fail:
        msg: "/var/run/docker.sock is not available on the provisioned host."
      when: not docker_socket.stat.exists

    - name: Verify Node.js installation
      ansible.builtin.command:
        cmd: node --version
      register: node_version
      changed_when: false

    - name: Show Node.js version
      ansible.builtin.debug:
        msg: "Node.js version: {{ node_version.stdout }}"

    - name: Verify Docker connection
      ansible.builtin.command:
        cmd: docker version
      register: docker_version
      changed_when: false

    - name: Show Docker version
      ansible.builtin.debug:
        var: docker_version.stdout_lines

    - name: Pull Taskflow API image built in Lab 07
      ansible.builtin.command:
        cmd: "docker pull {{ taskflow_image }}"
      register: docker_pull
      changed_when: >
        'Downloaded newer image' in docker_pull.stdout
        or 'Pull complete' in docker_pull.stdout